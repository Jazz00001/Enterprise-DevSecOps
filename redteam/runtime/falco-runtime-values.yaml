driver:
  kind: modern_ebpf

falcoctl:
  artifact:
    install:
      enabled: false
    follow:
      enabled: false

customRules:
  runtime-lab-rules.yaml: |-
    - rule: Runtime Lab Command In Runtime Namespace
      desc: Detect command execution inside runtime-lab Kubernetes pods
      condition: >
        evt.type=execve and
        evt.dir=< and
        container.id != host and
        k8s.ns.name=runtime-lab
      output: >
        Runtime lab alert: command executed inside runtime-lab pod
        (user=%user.name command=%proc.cmdline process=%proc.name container=%container.name image=%container.image.repository pod=%k8s.pod.name namespace=%k8s.ns.name)
      priority: CRITICAL
      tags: [runtime-lab, falco, kubernetes-attack, privileged-pod]
