- rule: Runtime Lab Host Shadow Access
  desc: Detect attacker pod reading host shadow file through mounted hostPath
  condition: >
    open_read and
    fd.name contains "/host/etc/shadow"
  output: >
    Runtime lab alert: host shadow file accessed through mounted hostPath
    (user=%user.name command=%proc.cmdline file=%fd.name container=%container.name image=%container.image.repository pod=%k8s.pod.name namespace=%k8s.ns.name)
  priority: CRITICAL
  tags: [runtime-lab, container-escape, hostpath, sensitive-file]
