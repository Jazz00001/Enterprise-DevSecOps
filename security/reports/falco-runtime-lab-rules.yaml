- rule: Runtime Lab Shell In Attacker Privileged Pod
  desc: Detect shell execution inside the attacker privileged pod
  condition: >
    spawned_process and
    container and
    proc.name in (sh, ash, cat, ls, id) and
    k8s.ns.name = runtime-lab
  output: >
    Runtime lab alert: suspicious command inside runtime-lab pod
    (user=%user.name command=%proc.cmdline process=%proc.name container=%container.name image=%container.image.repository pod=%k8s.pod.name namespace=%k8s.ns.name)
  priority: CRITICAL
  tags: [runtime-lab, falco, privileged-pod, kubernetes-attack]
