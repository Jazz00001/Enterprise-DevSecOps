- rule: Runtime Lab Privileged Pod Command Execution
  desc: Detect command execution inside attacker privileged pod
  condition: >
    spawned_process and
    k8s.ns.name = runtime-lab and
    k8s.pod.name = attacker-privileged
  output: >
    Runtime lab alert: command executed inside privileged attacker pod
    (user=%user.name command=%proc.cmdline file=%fd.name container=%container.name image=%container.image.repository pod=%k8s.pod.name namespace=%k8s.ns.name)
  priority: CRITICAL
  tags: [runtime-lab, privileged-pod, container-escape]
