name: ZAP Baseline DAST

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  zap-baseline:
    name: ZAP baseline scan against hardened app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install app dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/app/requirements-secure.txt

      - name: Initialize database
        working-directory: src/app
        run: |
          python init_db.py

      - name: Start hardened Flask app
        working-directory: src/app
        run: |
          gunicorn --bind 0.0.0.0:5000 app_hardened:app &
          sleep 8
          curl -sSf http://127.0.0.1:5000/health

      - name: ZAP baseline gate
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: "http://127.0.0.1:5000"
          fail_action: true
          allow_issue_writing: false
          cmd_options: "-a"
