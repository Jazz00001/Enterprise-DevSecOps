name: Enterprise DevSecOps CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write
  packages: write
  actions: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  sast:
    name: SAST - Bandit Python Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Run Bandit scan
        run: |
          mkdir -p security/reports
          bandit -r src/app -f json -o security/reports/bandit-report.json || true
          bandit -r src/app || true

      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-sast-report
          path: security/reports/bandit-report.json

  dependency-scan:
    name: SCA - Python Dependency Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Run pip-audit
        run: |
          mkdir -p security/reports
          pip-audit -r src/app/requirements.txt -f json -o security/reports/pip-audit-report.json || true
          pip-audit -r src/app/requirements.txt || true

      - name: Upload pip-audit report
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-dependency-report
          path: security/reports/pip-audit-report.json

  filesystem-scan:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          output: security/reports/trivy-fs-report.txt
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: "0"

      - name: Upload Trivy filesystem report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-filesystem-report
          path: security/reports/trivy-fs-report.txt

  docker-build-and-scan:
    name: Docker Build and Image Scan
    runs-on: ubuntu-latest
    needs: [sast, dependency-scan, filesystem-scan]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t devsecops-vuln-app:${{ github.sha }} .

      - name: Run Trivy image scan table report
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: devsecops-vuln-app:${{ github.sha }}
          format: table
          output: security/reports/trivy-image-report.txt
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: "0"

      - name: Run Trivy image scan SARIF report
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: devsecops-vuln-app:${{ github.sha }}
          format: sarif
          output: security/reports/trivy-image-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Upload Trivy SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: security/reports/trivy-image-results.sarif

      - name: Upload Trivy image reports
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-reports
          path: |
            security/reports/trivy-image-report.txt
            security/reports/trivy-image-results.sarif

  push-to-ghcr:
    name: Push Image to GitHub Container Registry
    runs-on: ubuntu-latest
    needs: [docker-build-and-scan]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:latest
            ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
