name: Release Supply Chain

on:
  workflow_dispatch:
  release:
    types: [ "published" ]

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}:${{ github.sha }}

jobs:
  release-supply-chain:
    name: Build, push, SBOM, sign, and attest hardened image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build hardened image
        run: |
          docker build -f Dockerfile.hardened -t "$IMAGE_NAME" .

      - name: Push hardened image
        run: |
          docker push "$IMAGE_NAME"

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0.17.0

      - name: Generate SPDX SBOM
        run: |
          mkdir -p security/sbom
          syft "$IMAGE_NAME" -o spdx-json=security/sbom/release-sbom-spdx.json

      - name: Generate CycloneDX SBOM
        run: |
          mkdir -p security/sbom
          syft "$IMAGE_NAME" -o cyclonedx-json=security/sbom/release-sbom-cyclonedx.json

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Keyless sign image with Cosign
        run: |
          cosign sign --yes "$IMAGE_NAME"

      - name: Generate GitHub provenance attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          push-to-registry: true

      - name: Upload release supply chain artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-supply-chain-artifacts
          path: |
            security/sbom/release-sbom-spdx.json
            security/sbom/release-sbom-cyclonedx.json
          if-no-files-found: error
