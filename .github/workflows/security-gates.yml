name: Security Gates - Blocking

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-security-gates:
    name: Python SAST and dependency gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit

      - name: Bandit gate - fail on high severity findings
        run: |
          mkdir -p security/reports
          bandit -r src/app \
            --severity-level high \
            --confidence-level medium \
            -f json \
            -o security/reports/bandit-gate.json

      - name: pip-audit gate - fail on vulnerable secure dependencies
        run: |
          mkdir -p security/reports
          pip-audit -r src/app/requirements-secure.txt \
            -f json \
            -o security/reports/pip-audit-gate.json

      - name: Upload Python security gate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-security-gate-reports
          path: |
            security/reports/bandit-gate.json
            security/reports/pip-audit-gate.json
          if-no-files-found: warn

  config-security-gates:
    name: Dockerfile and Kubernetes config gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Trivy config gate - fail on HIGH/CRITICAL misconfigurations
        uses: aquasecurity/trivy-action@0.36.0
        with:
          scan-type: "config"
          scan-ref: "."
          severity: "HIGH,CRITICAL"
          exit-code: "1"
          ignore-unfixed: true
          format: "table"
          output: "security/reports/trivy-config-gate.txt"

      - name: Upload Trivy config gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-config-gate-report
          path: security/reports/trivy-config-gate.txt
          if-no-files-found: warn

  workflow-quality-gate:
    name: Workflow quality gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Fail if blocking workflows contain fake gates
        run: |
          echo "Checking blocking workflows for fake gates..."

          checked_files="
          .github/workflows/security-gates.yml
          .github/workflows/gitleaks.yml
          .github/workflows/trivy-container.yml
          .github/workflows/zap-baseline.yml
          .github/workflows/codeql.yml
          "

          pipe_symbol="|"
          fake_continue_pattern="${pipe_symbol}${pipe_symbol} true"

          quote_zero='"0"'
          fake_exit_pattern="exit-code: ${quote_zero}"

          if grep -R -F "$fake_continue_pattern" $checked_files 2>/dev/null; then
            echo "ERROR: Blocking workflows contain fake continue pattern."
            exit 1
          fi

          if grep -R -F "$fake_exit_pattern" $checked_files 2>/dev/null; then
            echo "ERROR: Blocking workflows contain fake zero exit-code pattern."
            exit 1
          fi

          echo "PASS: no fake gates found in blocking workflows."
