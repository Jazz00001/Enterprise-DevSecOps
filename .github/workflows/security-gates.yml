  gate-summary:
    name: Security Gate Summary
    runs-on: ubuntu-24.04
    needs:
      - sast-bandit
      - sca-pip-audit
      - trivy-filesystem
      - trivy-config
      - trivy-image
    if: always()

    steps:
      - name: Download all security gate artifacts
        uses: actions/download-artifact@v4
        with:
          path: collected-security-gate-artifacts
          merge-multiple: true

      - name: Build final security gate summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          results = []
          for path in Path("collected-security-gate-artifacts").rglob("*gate-result.json"):
              try:
                  results.append(json.loads(path.read_text()))
              except Exception as exc:
                  results.append({"tool": str(path), "gate": "unknown", "status": f"parse-error: {exc}"})

          lines = ["# Security Gates Summary", ""]
          lines.append("| Gate | Tool | Status | Key Result |")
          lines.append("|---|---|---|---|")

          for item in sorted(results, key=lambda x: x.get("gate", "")):
              gate = item.get("gate", "Unknown")
              tool = item.get("tool", "Unknown")
              status = str(item.get("status", "unknown")).upper()
              if "total_vulnerabilities" in item:
                  key = f"{item['total_vulnerabilities']} dependency vulnerabilities"
              elif "critical" in item or "high" in item:
                  key = f"Critical={item.get('critical', 0)}, High={item.get('high', 0)}, Medium={item.get('medium', 0)}"
              else:
                  key = f"High={item.get('high', 0)}, Medium={item.get('medium', 0)}, Total={item.get('total', 0)}"
              lines.append(f"| {gate} | {tool} | {status} | {key} |")

          Path("security-gates-final-summary.md").write_text("\n".join(lines) + "\n")
          print("\n".join(lines))
          PY

          cat security-gates-final-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload final gate summary
        uses: actions/upload-artifact@v4
        with:
          name: security-gates-final-summary
          path: security-gates-final-summary.md
          retention-days: 30

      - name: Reflect failed gate jobs in final status
        run: |
          echo "Bandit job: ${{ needs.sast-bandit.result }}"
          echo "pip-audit job: ${{ needs.sca-pip-audit.result }}"
          echo "Trivy filesystem job: ${{ needs.trivy-filesystem.result }}"
          echo "Trivy config job: ${{ needs.trivy-config.result }}"
          echo "Trivy image job: ${{ needs.trivy-image.result }}"

          if [ "${{ needs.sast-bandit.result }}" = "failure" ] || \
             [ "${{ needs.sca-pip-audit.result }}" = "failure" ] || \
             [ "${{ needs.trivy-filesystem.result }}" = "failure" ] || \
             [ "${{ needs.trivy-config.result }}" = "failure" ] || \
             [ "${{ needs.trivy-image.result }}" = "failure" ]; then
            echo "One or more security gates failed."
            exit 1
          fi
