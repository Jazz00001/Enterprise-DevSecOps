name: Security Gates - Hardened Release Mode

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: security-gates-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  APP_PATH: "src/app"
  DEFAULT_REQUIREMENTS: "src/app/requirements.txt"
  SECURE_REQUIREMENTS: "src/app/requirements-secure.txt"
  HARDENED_DOCKERFILE: "Dockerfile.hardened"
  HARDENED_IMAGE: "enterprise-devsecops-hardened:${{ github.sha }}"

jobs:
  tests:
    name: Unit and security regression tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f "${SECURE_REQUIREMENTS}" ]; then
            echo "Using secure requirements file: ${SECURE_REQUIREMENTS}"
            pip install -r "${SECURE_REQUIREMENTS}"
          elif [ -f "${DEFAULT_REQUIREMENTS}" ]; then
            echo "Secure requirements file not found. Falling back to: ${DEFAULT_REQUIREMENTS}"
            pip install -r "${DEFAULT_REQUIREMENTS}"
          else
            echo "No requirements file found. Continuing with test tooling only."
          fi

          pip install pytest pytest-cov requests gunicorn

      - name: Run unit and security regression tests in evidence mode
        run: |
          mkdir -p security/reports

          if [ -d "tests" ]; then
            python -m pytest tests/ -v \
              --junitxml=security/reports/pytest-results.xml \
              | tee security/reports/pytest-security-regression-report.txt || true
          else
            echo "No tests directory found." | tee security/reports/pytest-security-regression-report.txt
          fi

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-security-regression-test-evidence
          path: |
            security/reports/pytest-results.xml
            security/reports/pytest-security-regression-report.txt
          if-no-files-found: ignore
          retention-days: 30

  hardened-container:
    name: Build and scan hardened container image
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify hardened Dockerfile exists
        run: |
          test -f "${HARDENED_DOCKERFILE}"
          echo "Found ${HARDENED_DOCKERFILE}"

      - name: Build hardened Docker image
        run: |
          docker build \
            -f "${HARDENED_DOCKERFILE}" \
            -t "${HARDENED_IMAGE}" \
            .

      - name: Verify hardened image runs as non-root
        run: |
          docker run --rm --entrypoint id "${HARDENED_IMAGE}" | tee hardened-image-user.txt

          if grep -q "uid=0" hardened-image-user.txt; then
            echo "Container is running as root. Failing hardened image validation."
            exit 1
          fi

          echo "Container non-root validation passed."

      - name: Run Trivy hardened image scan in evidence mode
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.HARDENED_IMAGE }}
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true
          format: table
          output: trivy-hardened-image-report.txt
          exit-code: "0"

      - name: Upload hardened image evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hardened-container-evidence
          path: |
            hardened-image-user.txt
            trivy-hardened-image-report.txt
          if-no-files-found: ignore
          retention-days: 30

  repository-security-scan:
    name: Repository security scan evidence
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run Trivy filesystem scan in evidence mode
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true
          format: table
          output: trivy-filesystem-report.txt
          exit-code: "0"

      - name: Upload repository scan evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repository-security-scan-evidence
          path: trivy-filesystem-report.txt
          if-no-files-found: ignore
          retention-days: 30

  security-gate-summary:
    name: Security gate summary
    runs-on: ubuntu-24.04
    needs:
      - tests
      - hardened-container
      - repository-security-scan
    if: always()

    steps:
      - name: Create security gate summary
        run: |
          {
            echo "# Security Gates Summary"
            echo
            echo "Security gate workflow completed in hardened release evidence mode."
            echo
            echo "Completed jobs:"
            echo "- Unit and security regression tests"
            echo "- Hardened Dockerfile existence check"
            echo "- Hardened container image build"
            echo "- Non-root runtime validation"
            echo "- Trivy hardened image scan"
            echo "- Trivy repository scan"
            echo
            echo "Note:"
            echo "This repository is a private DevSecOps lab and may intentionally contain vulnerable components."
            echo "Scanner/test findings are collected as evidence artifacts instead of blocking every push."
          } >> "$GITHUB_STEP_SUMMARY"
