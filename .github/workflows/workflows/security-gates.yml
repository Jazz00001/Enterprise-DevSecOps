name: Security Gates - Hardened Release Mode

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: security-gates-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  SECURE_REQUIREMENTS: "src/app/requirements-secure.txt"
  HARDENED_DOCKERFILE: "Dockerfile.hardened"
  HARDENED_IMAGE: "enterprise-devsecops-hardened:${{ github.sha }}"

jobs:
  tests:
    name: Unit and security regression tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            src/app/requirements.txt
            src/app/requirements-secure.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/app/requirements.txt
          pip install pytest
      - name: Run pytest
        run: python -m pytest -q

  sast:
    name: SAST - hardened reference app
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Run Bandit on hardened app
        run: |
          python -m pip install --upgrade pip bandit[toml,sarif]
          mkdir -p security/reports
          bandit src/app/app_hardened.py -s B104,B404,B603,B607 -f json -o security/reports/bandit-hardened-report.json
          bandit src/app/app_hardened.py -s B104,B404,B603,B607 -f sarif -o security/reports/bandit-hardened-report.sarif || true
      - name: Upload SARIF
        if: always() && hashFiles('security/reports/bandit-hardened-report.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        with:
          sarif_file: security/reports/bandit-hardened-report.sarif
          category: bandit-hardened
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-hardened-evidence
          path: security/reports/bandit-hardened-report.*
          retention-days: 30

  dependency-scan:
    name: SCA - secure dependency baseline
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Run pip-audit on secure requirements
        run: |
          python -m pip install --upgrade pip pip-audit
          mkdir -p security/reports
          pip-audit -r ${{ env.SECURE_REQUIREMENTS }} -f json -o security/reports/pip-audit-secure-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pip-audit-secure-evidence
          path: security/reports/pip-audit-secure-report.json
          retention-days: 30

  container-scan:
    name: Container scan - hardened image
    runs-on: ubuntu-24.04
    needs: [tests, sast, dependency-scan]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build hardened Docker image
        run: docker build -f ${{ env.HARDENED_DOCKERFILE }} -t ${{ env.HARDENED_IMAGE }} .
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ${{ env.HARDENED_IMAGE }}
          format: sarif
          output: security/reports/trivy-hardened-image.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"
      - name: Upload Trivy SARIF
        if: always() && hashFiles('security/reports/trivy-hardened-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        with:
          sarif_file: security/reports/trivy-hardened-image.sarif
          category: trivy-hardened-image
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-hardened-image-evidence
          path: security/reports/trivy-hardened-image.sarif
          retention-days: 30
