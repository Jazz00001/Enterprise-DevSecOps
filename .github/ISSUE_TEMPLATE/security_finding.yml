name: Security Finding
about: Track a vulnerability, misconfiguration, or control weakness
labels: [security, finding]
body:
  - type: input
    id: finding_id
    attributes:
      label: Finding ID
      placeholder: FINDING-APP-001
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Business and technical summary
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options: [Critical, High, Medium, Low]
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence paths
      placeholder: screenshots/035-sql-injection-proof.png
  - type: textarea
    id: remediation
    attributes:
      label: Remediation plan
  - type: textarea
    id: retest
    attributes:
      label: Retest criteria
